# ─── Production Compose ───────────────────────────────────────────────────────
# Usage:
#   cp .env.example .env   # first time only — fill in real secrets
#   docker compose up -d --build
#
# Services:
#   db-migrate         — runs `prisma db push` once then exits
#   grace              — GRACE Vision AI (FastAPI), internal only
#   academic-bulletin  — Next.js production server (port 3000, internal only)
#   apache             — Apache reverse proxy (port 80, exposed to host/internet)
#
# Users connect to :80 (Apache) → Apache forwards to :3000 (academic-bulletin).
# Port 3000 is NEVER directly accessible from outside the Docker network.
# GRACE (:7860) is internal only — only academic-bulletin calls it.
#
# TLS: Run `certbot --apache -d your-domain.com` on the Debian host after first
#      deploy. Certbot adds the :443 VirtualHost automatically — no compose
#      changes needed. Then run: docker compose restart apache
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Database Migration ──────────────────────────────────────────────────────
  # Runs once at deploy time, pushes the Prisma schema, then exits successfully.
  # academic-bulletin will not start until this completes.
  db-migrate:
    build:
      context: ./academic-bulletin
      dockerfile: Dockerfile
      target: builder
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
    command: npx prisma db push
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - abrms-network

  # ── GRACE Vision AI ─────────────────────────────────────────────────────────
  # Internal-only FastAPI service. Only academic-bulletin calls it via:
  #   http://grace:7860
  # Port 7860 is NOT exposed to the host or internet.
  grace:
    build:
      context: ./GRACE
      dockerfile: Dockerfile
    container_name: abrms-grace-prod
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    restart: always
    expose:
      - "7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/').getcode()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - abrms-network

  # ── Next.js Application Server ──────────────────────────────────────────────
  # Port 3000 is intentionally NOT mapped to the host.
  # Only Apache (via abrms-network) can reach it.
  academic-bulletin:
    build:
      context: ./academic-bulletin
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
    container_name: abrms-nextjs-prod
    restart: always
    env_file:
      - .env
    environment:
      - GRACE_VISION_SPACE_URL=http://grace:7860
    
    # Map Next.js to the host's loopback interface only.
    # This prevents the public internet from reaching Next.js directly,
    # but allows the host's native Apache to proxy to it.
    ports:
      - "127.0.0.1:3000:3000"

    depends_on:
      grace:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - abrms-network

# ── Private Network ────────────────────────────────────────────────────────────
# All services communicate over this isolated bridge network.
# Only Apache's port 80 is reachable from outside — everything else is internal.
networks:
  abrms-network:
    driver: bridge
