# ─── Development Compose (Docker) ────────────────────────────────────────────
# Self-contained stack: PostgreSQL, GoTrue Auth, Supabase Storage API,
# GRACE Vision AI, and Next.js — all running inside Docker with no external
# Supabase cloud dependencies.
#
# Usage:
#   docker compose down -v   # wipe volumes on first run (so init SQL fires)
#   docker compose up --build
#
# NOTE: In PRODUCTION the auth and storage services run as native systemd units
#       on the bare-metal server and Apache proxies /auth/v1/* and /storage/v1/*.
#       In DEVELOPMENT Next.js rewrites (next.config.ts) handle the same routing.
#
# Services:
#   db              — PostgreSQL 15 with auth + storage schemas pre-created
#   auth            — GoTrue (Supabase Auth engine) on :9999, internal only
#   storage         — Supabase Storage API on :5000, internal only
#   db-migrate      — runs `prisma db push` once then exits
#   grace           — GRACE Vision AI (FastAPI), internal only
#   academic-bulletin — Next.js production server, exposed on host :3300
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: abrms-db-local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once on a fresh volume — creates auth & storage schemas
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    networks:
      - abrms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── GoTrue — Self-hosted Supabase Auth ──────────────────────────────────────
  # Handles user login, sessions, and password management.
  # Next.js rewrites /auth/v1/* → http://auth:9999/* (dev only).
  # In production, Apache mod_proxy handles the same routing.
  auth:
    image: supabase/gotrue:v2.158.1
    container_name: abrms-auth
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: "0.0.0.0"
      PORT: 9999

      # Database — GoTrue auto-migrates the auth schema on first start.
      # Uses supabase_auth_admin whose search_path is set to 'auth' at the role
      # level — GoTrue's pop ORM ignores search_path in the connection URL.
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"

      # JWT — must match the keys in .env
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated

      # Site URL — in dev this is the Next.js host address
      GOTRUE_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3300}
      API_EXTERNAL_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3300}
      GOTRUE_API_EXTERNAL_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3300}
      GOTRUE_MAILER_EXTERNAL_HOSTS: "localhost:3300,localhost,127.0.0.1:3300,bulletin.babcock.edu.ng"
      GOTRUE_URI_ALLOW_LIST: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3300}/**,${NEXT_PUBLIC_SITE_URL:-http://localhost:3300},http://localhost:3300/confirm,http://localhost:3300/invite-accept,http://bulletin.babcock.edu.ng/**,http://bulletin.babcock.edu.ng"
      GOTRUE_MAILER_URLPATHS_INVITE: /verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /verify

      # Mailer & SMTP configuration
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-false}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-${SMTP_USER}}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Babcock Academic Bulletin}
    ports:
      - "9999:9999"
    expose:
      - "9999"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9999/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - abrms-network

  # ── Supabase Storage API ─────────────────────────────────────────────────────
  # Handles file uploads (staff photos, submission images).
  # Next.js rewrites /storage/v1/* → http://storage:5000/* (dev only).
  # In production, Apache mod_proxy handles the same routing.
  storage:
    image: supabase/storage-api:v1.11.13
    container_name: abrms-storage
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: unless-stopped
    environment:
      SERVER_PORT: 5000
      REGION: local

      # Database — Storage API auto-migrates the storage schema on first start.
      # Uses supabase_storage_admin whose search_path is set to 'storage' at the role level.
      DATABASE_URL: "postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      DB_INSTALL_ROLES: "false"

      # JWT — must match JWT_SECRET
      PGRST_JWT_SECRET: ${JWT_SECRET}
      AUTH_JWT_ALGORITHM: HS256
      ANON_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      # File storage — files are written to a named Docker volume
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      UPLOAD_FILE_SIZE_LIMIT: 5242880
      UPLOAD_FILE_SIZE_LIMIT_STANDARD: 5242880

      # Single-tenant mode (one university)
      IS_MULTITENANT: "false"
      TENANT_ID: stub

      # This app uses service_role key only — PostgREST is not needed.
      # Point to self as a safe no-op placeholder.
      POSTGREST_URL: "http://storage:5000"
    volumes:
      - storage_data:/var/lib/storage
    ports:
      - "5000:5000"
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - abrms-network

  # ── Database Migration ──────────────────────────────────────────────────────
  # Runs `prisma db push` once at deploy time, then exits successfully.
  # academic-bulletin will not start until this completes.
  db-migrate:
    build:
      context: ./academic-bulletin
      dockerfile: Dockerfile
      target: builder
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
        - GOTRUE_INTERNAL_URL=http://auth:9999
        - STORAGE_INTERNAL_URL=http://storage:5000
    command: sh -c "npm run db:push"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - INTERNAL_SUPABASE_URL=http://academic-bulletin:3000
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks:
      - abrms-network

  # ── GRACE Vision AI ─────────────────────────────────────────────────────────
  grace:
    build:
      context: ./GRACE
      dockerfile: Dockerfile
    container_name: abrms-grace-prod
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    restart: always
    expose:
      - "7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/').getcode()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - abrms-network

  # ── Next.js Application Server ──────────────────────────────────────────────
  academic-bulletin:
    build:
      context: ./academic-bulletin
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
        - GOTRUE_INTERNAL_URL=http://auth:9999
        - STORAGE_INTERNAL_URL=http://storage:5000
    container_name: abrms-nextjs-prod
    restart: always
    env_file:
      - .env
    environment:
      - DOCKER_ENV=true
      - IS_DOCKER=true
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3300}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:3300}
      - GRACE_VISION_SPACE_URL=http://grace:7860
      - INTERNAL_SUPABASE_URL=http://127.0.0.1:3000
      - GOTRUE_INTERNAL_URL=http://auth:9999
      - STORAGE_INTERNAL_URL=http://storage:5000
    ports:
      - "127.0.0.1:3300:3000"
    depends_on:
      grace:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - abrms-network

# ── Private Network ─────────────────────────────────────────────────────────────
networks:
  abrms-network:
    driver: bridge

volumes:
  postgres_data:
  storage_data:
